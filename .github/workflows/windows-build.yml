name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'licenses/**'
      - 'README.md'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test and build portable application
        shell: pwsh
        run: |
          ./scripts/build.ps1
          Get-Item artifacts/usbPhone-win-x64/usbPhone.exe -ErrorAction Stop
      - name: Check the Windows interface
        shell: powershell
        timeout-minutes: 3
        run: ./scripts/test-window.ps1 -Executable artifacts/usbPhone-win-x64/usbPhone.exe
      - uses: actions/upload-artifact@v4
        with:
          name: usbPhone-win-x64
          path: artifacts/usbPhone-win-x64/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usbPhone-win-x64
          path: usbPhone-win-x64
      - name: Publish portable files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s usbPhone-win-x64/usbPhone.exe
          (cd usbPhone-win-x64 && zip -q -r ../usbPhone-win-x64.zip .)
          unzip -tq usbPhone-win-x64.zip
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "usbPhone ${GITHUB_REF_NAME#v}" \
            --notes 'Готовая сборка для Windows x64. Скачайте usbPhone.exe или ZIP с инструкцией. Среда .NET включена. При первом запуске укажите adb.exe из Android SDK Platform-Tools.' \
            usbPhone-win-x64/usbPhone.exe usbPhone-win-x64.zip
